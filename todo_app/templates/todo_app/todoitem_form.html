<!-- todo_list/todo_app/templates/todo_app/todoitem_form.html -->
{% extends "base.html" %}

{% block content %}

<h3>{{ title }}</h3>
<form method="post">
    {% csrf_token %}
    <table>
        {{ form.as_table }}
    </table>
    <p class="form-actions">
        <input class="btn btn-primary" value="Submit" type="submit">
        <input class="btn btn-secondary" value="Cancel" type="button" onclick="location.href='{% url "list" todo_list.id %}'">
        {% if object %}
        <input class="btn btn-danger" value="Delete this item" type="button" onclick="location.href='{% url "item-delete" todo_list.id object.id %}'">
        {% endif %}
    </p>
</form>

{% endblock %}
