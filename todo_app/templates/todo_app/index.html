{% extends "base.html" %}
{% block content %}
{% if object_list %}
<h3>All my lists</h3>
{% endif %}
<ul>
    {% for todolist in object_list %}
    <li>
        <div
            role="button"
            onclick="location.href='{% url "list" todolist.id %}'">
            {{ todolist.title }}
        </div>
    </li>
    {% empty %}
    <h4 class="empty-state">You have no lists!</h4>
    {% endfor %}
</ul>
<p class="form-actions">
    <input
        class="btn btn-primary"
        value="Add a new list"
        type="button"
        onclick="location.href='{% url "list-add" %}'"/>
</p>
{% endblock %}
